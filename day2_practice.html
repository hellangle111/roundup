<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add -ing Practice – Part 3</title>

<style>
body{
  font-family:"Comic Sans MS", Arial, sans-serif;
  background:#e1f5fe;
  padding:25px;
}

.page{
  max-width:900px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:24px;
  border:6px dashed #66bb6a;
}

h1{
  text-align:center;
  background:#a5d6a7;
  padding:15px;
  border-radius:18px;
  font-size:36px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  margin-top:20px;
}

.item{
  background:#f5f5f5;
  border-radius:14px;
  padding:12px;
  font-size:24px;
}

input{
  width:100%;
  padding:8px;
  font-size:22px;
  border-radius:10px;
  border:2px solid #777;
}

.correct{background:#e8f5e9;border-color:#2e7d32;}
.wrong{background:#ffebee;border-color:#c62828;}

button{
  display:block;
  margin:30px auto 10px;
  padding:14px 50px;
  font-size:24px;
  border-radius:30px;
  border:none;
  background:#66bb6a;
  color:white;
  cursor:pointer;
}

.result{
  text-align:center;
  font-weight:bold;
  font-size:26px;
  margin-top:10px;
}

@media print{
  body{background:white;}
  button{display:none;}
}
</style>
</head>

<body>

<div class="page">

<h1>✏️ Add -ing – Big Practice</h1>

<div class="grid">
<div class="item">1. swim → <input data-ok="swimming"></div>
<div class="item">2. sit → <input data-ok="sitting"></div>
<div class="item">3. read → <input data-ok="reading"></div>
<div class="item">4. drink → <input data-ok="drinking"></div>
<div class="item">5. do → <input data-ok="doing"></div>
<div class="item">6. sing → <input data-ok="singing"></div>
<div class="item">7. make → <input data-ok="making"></div>
<div class="item">8. kick → <input data-ok="kicking"></div>
<div class="item">9. play → <input data-ok="playing"></div>
<div class="item">10. sleep → <input data-ok="sleeping"></div>
<div class="item">11. fight → <input data-ok="fighting"></div>
<div class="item">12. clean → <input data-ok="cleaning"></div>
<div class="item">13. run → <input data-ok="running"></div>
<div class="item">14. jump → <input data-ok="jumping"></div>
<div class="item">15. talk → <input data-ok="talking"></div>
<div class="item">16. watch → <input data-ok="watching"></div>
<div class="item">17. cook → <input data-ok="cooking"></div>
<div class="item">18. eat → <input data-ok="eating"></div>
<div class="item">19. cut → <input data-ok="cutting"></div>
<div class="item">20. dance → <input data-ok="dancing"></div>
<div class="item">21. have → <input data-ok="having"></div>
</div>

<button onclick="check()">✅ Check</button>
<div class="result"></div>

</div>

<script>
function norm(t){return t.toLowerCase().trim();}
function check(){
  const inputs=document.querySelectorAll("input");
  let score=0;
  inputs.forEach(i=>{
    if(norm(i.value)===norm(i.dataset.ok)){
      i.className="correct"; score++;
    }else i.className="wrong";
  });
  document.querySelector(".result").textContent =
    `🎯 ${score} / ${inputs.length} correct`;
}
</script>

</body>
</html>
