<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Level 3 – Verb Changes Practice</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f0f8ff;
  padding:20px;
}

.page{
  max-width:900px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#1565c0;
}

.question{
  margin:15px 0;
  font-size:18px;
}

input{
  padding:5px;
  font-size:16px;
  width:160px;
}

.wrong{
  border:2px solid red;
  background:#ffe6e6;
}

.correct{
  border:2px solid green;
  background:#e6ffe6;
}

button{
  margin-top:20px;
  padding:10px 15px;
  font-size:16px;
}
</style>
</head>

<body>

<div class="page">

<h1>Level 3 – Verb Transformation (Hard)</h1>

<p><b>Instructions:</b> Fill in the correct form of the verb.  
Red color appears only when you leave the box.</p>

<div id="questions"></div>

<button onclick="checkAll()">Check All</button>

</div>

<script>

const data = [

/* 2 QUESTIONS */
{ q: "1. Why _____ he always (carry) a heavy bag to school?", a: "does he always carry" },
{ q: "2. What _____ she (do) right now?", a: "is she doing" },

/* 8 STATEMENTS */
{ q: "3. She (study) English every evening.", a: "studies" },          // y → ies
{ q: "4. The baby (cry) loudly at night.", a: "cries" },              // y → ies
{ q: "5. He (fix) broken bikes on weekends.", a: "fixes" },           // x → es
{ q: "6. Tom (watch) TV after dinner.", a: "watches" },               // ch → es
{ q: "7. She is (run) in the park.", a: "running" },                  // double n
{ q: "8. The dog is (sit) near the door.", a: "sitting" },            // double t
{ q: "9. She is (write) a letter.", a: "writing" },                   // drop e
{ q: "10. They are (swim) in the pool.", a: "swimming" }              // double m

];

const container = document.getElementById("questions");

data.forEach((item,index)=>{
  const div = document.createElement("div");
  div.className="question";
  div.innerHTML = item.q + "<br><input type='text' id='q"+index+"'>";
  container.appendChild(div);
});

function normalize(text){
  return text.toLowerCase().trim();
}

function checkInput(i){
  const input = document.getElementById("q"+i);
  if(normalize(input.value) === data[i].a){
    input.classList.remove("wrong");
    input.classList.add("correct");
  }else{
    input.classList.remove("correct");
    input.classList.add("wrong");
  }
}

/* Only check when lost focus */
data.forEach((item,index)=>{
  document.addEventListener("blur", function(e){
    if(e.target && e.target.id === "q"+index){
      checkInput(index);
    }
  }, true);
});

function checkAll(){
  data.forEach((item,index)=>{
    checkInput(index);
  });
}

</script>

</body>
</html>
