<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Level 3 – Verb Changes Practice</title>

<style>
body{
  font-family:"Comic Sans MS", Arial, sans-serif;
  background:#e3f2fd;
  padding:20px;
}

.page{
  max-width:900px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#0d47a1;
}

.question{
  margin:15px 0;
  font-size:18px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

input{
  padding:6px;
  font-size:16px;
  width:170px;
  border:2px solid #90caf9;
  border-radius:6px;
}

input:focus{
  outline:none;
  border-color:#1976d2;
}

.wrong{
  border:2px solid red !important;
  background:#ffe6e6;
}

.correct{
  border:2px solid green !important;
  background:#e6ffe6;
}

button{
  margin-top:20px;
  padding:10px 18px;
  font-size:16px;
  border:none;
  background:#1976d2;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#0d47a1;
}
</style>
</head>

<body>

<div class="page">

<h1>Level 3 – Verb Transformation</h1>

<p><b>Instructions:</b> Fill in the correct verb form.  
The box turns red only when you leave it.</p>

<div id="questions"></div>

<button onclick="checkAll()">Check All</button>

</div>

<script>

const data = [

/* 2 QUESTIONS */
{ q: "1. Why _____ he always (carry) a heavy bag to school?", a: "does he always carry" },
{ q: "2. What _____ she (do) right now?", a: "is she doing" },

/* 8 STATEMENTS */
{ q: "3. She (study) English every evening.", a: "studies" },
{ q: "4. The baby (cry) loudly at night.", a: "cries" },
{ q: "5. He (fix) broken bikes on weekends.", a: "fixes" },
{ q: "6. Tom (watch) TV after dinner.", a: "watches" },
{ q: "7. She is (run) in the park.", a: "running" },
{ q: "8. The dog is (sit) near the door.", a: "sitting" },
{ q: "9. She is (write) a letter.", a: "writing" },
{ q: "10. They are (swim) in the pool.", a: "swimming" }

];

const container = document.getElementById("questions");

data.forEach((item,index)=>{
  const div = document.createElement("div");
  div.className="question";
  div.innerHTML = `
    <span>${item.q}</span>
    <input type="text" id="q${index}">
  `;
  container.appendChild(div);
});

function normalize(text){
  return text.toLowerCase().trim();
}

function checkInput(i){
  const input = document.getElementById("q"+i);
  if(normalize(input.value) === data[i].a){
    input.classList.remove("wrong");
    input.classList.add("correct");
  }else{
    input.classList.remove("correct");
    input.classList.add("wrong");
  }
}

/* check only when lost focus */
data.forEach((item,index)=>{
  document.addEventListener("blur", function(e){
    if(e.target && e.target.id === "q"+index){
      checkInput(index);
    }
  }, true);
});

function checkAll(){
  data.forEach((item,index)=>{
    checkInput(index);
  });
}

</script>

</body>
</html>
