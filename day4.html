<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English Practice - Yes / No</title>
<style>
    body{
        font-family: "Comic Sans MS", Arial, sans-serif;
        background: linear-gradient(to right, #f2f7ff, #ffffff);
        margin: 0;
        padding: 20px;
    }

    h1{
        text-align:center;
        color:#2c3e50;
    }

    .container{
        max-width: 900px;
        margin: auto;
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .question{
        margin: 15px 0;
        padding: 12px;
        border-radius: 8px;
        background: #f8fbff;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .question span{
        font-size: 18px;
        min-width: 300px;
    }

    input{
        padding: 6px 10px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #ccc;
        width: 160px;
    }

    .result{
        margin-left: 10px;
        font-weight: bold;
        font-size: 18px;
    }

    button{
        margin-top: 20px;
        padding: 12px 20px;
        font-size: 18px;
        border-radius: 10px;
        border: none;
        background: #4caf50;
        color: white;
        cursor: pointer;
    }

    button:hover{
        background:#43a047;
    }
</style>
</head>

<body>

<h1>Yes / No English Practice</h1>

<div class="container">

    <div class="question">
        <span>1. Is the boy kicking the ball?</span>
        Yes / No:
        <input id="q1">
        <span id="r1" class="result"></span>
    </div>

    <div class="question">
        <span>2. Is the man riding a horse?</span>
        Yes / No:
        <input id="q2">
        <span id="r2" class="result"></span>
    </div>

    <div class="question">
        <span>3. Are the two girls talking?</span>
        Yes / No:
        <input id="q3">
        <span id="r3" class="result"></span>
    </div>

    <div class="question">
        <span>4. Is the girl playing tennis?</span>
        Yes / No:
        <input id="q4">
        <span id="r4" class="result"></span>
    </div>

    <div class="question">
        <span>5. Is the girl thinking?</span>
        Yes / No:
        <input id="q5">
        <span id="r5" class="result"></span>
    </div>

    <button onclick="checkAnswers()">Check Answers</button>

</div>

<script>
function normalize(text){
    return text
        .toLowerCase()
        .replace(/\s+/g,' ')
        .replace(/[.?!]/g,'')
        .trim();
}

function isCorrect(user, answers){
    user = normalize(user);
    return answers.some(ans => normalize(ans) === user);
}

function checkAnswers(){

    const data = [
        { id:1, answers:["yes","yes he is"] },
        { id:2, answers:["yes","yes he is"] },   // FIXED: accepts "yes, he is"
        { id:3, answers:["yes","yes they are"] },
        { id:4, answers:["yes","yes she is"] },
        { id:5, answers:["yes","yes she is"] }
    ];

    data.forEach(q=>{
        let user = document.getElementById("q"+q.id).value;
        let result = document.getElementById("r"+q.id);

        if(isCorrect(user, q.answers)){
            result.innerHTML = "✅";
            result.style.color = "green";
        }else{
            result.innerHTML = "❌";
            result.style.color = "red";
        }
    });
}
</script>

</body>
</html>
