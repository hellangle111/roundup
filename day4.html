<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Look & Write – Present Continuous</title>

<style>
body{
  font-family:"Comic Sans MS", Arial, sans-serif;
  background:linear-gradient(135deg,#fff9c4,#e1f5fe);
  padding:20px;
}

.page{
  max-width:950px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:22px;
  border:6px dashed #42a5f5;
}

h1{
  text-align:center;
  background:#90caf9;
  padding:15px;
  border-radius:18px;
  font-size:34px;
}

.note{
  text-align:center;
  font-size:22px;
  margin:15px 0;
  font-weight:bold;
}

.row{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:18px;
  background:#f5f5f5;
  padding:14px;
  border-radius:16px;
  margin-bottom:14px;
  align-items:center;
}

.pic img{
  width:100%;
  border-radius:14px;
  border:3px solid #90caf9;
}

.item{
  font-size:22px;
}

label{
  display:block;
  margin-top:6px;
}

input{
  width:100%;
  padding:8px;
  font-size:22px;
  border-radius:10px;
  border:2px solid #777;
}

.correct{background:#e8f5e9;border-color:#2e7d32;}
.wrong{background:#ffebee;border-color:#c62828;}

button{
  display:block;
  margin:25px auto 10px;
  padding:14px 45px;
  font-size:24px;
  border-radius:30px;
  border:none;
  background:#42a5f5;
  color:white;
  cursor:pointer;
}

.result{
  text-align:center;
  font-weight:bold;
  font-size:26px;
}

@media print{
  button{display:none;}
  body{background:white;}
}
</style>
</head>

<body>

<div class="page">

<h1>👀 Look at the Picture & Write</h1>
<div class="note">✏️ Write sentences in Present Continuous</div>

<!-- EXAMPLE -->
<div class="row">
  <div class="pic">
    <img src="https://i.imgur.com/4AiXzf8.png">
  </div>
  <div class="item">
    <b>Example – play tennis</b>
    <div>Long: The girl is playing tennis.</div>
    <div>Short: She's playing tennis.</div>
  </div>
</div>

<!-- 2 -->
<div class="row">
  <div class="pic">
    <img src="https://i.imgur.com/oYiTqum.png">
  </div>
  <div class="item">
    <b>2. kick the ball</b>
    <label>Long form:</label>
    <input data-ok="the boy is kicking the ball">
    <label>Short form:</label>
    <input data-ok="he's kicking the ball">
  </div>
</div>

<!-- 3 -->
<div class="row">
  <div class="pic">
    <img src="https://i.imgur.com/YZ6X9qL.png">
  </div>
  <div class="item">
    <b>3. dance</b>
    <label>Long form:</label>
    <input data-ok="the girls are dancing">
    <label>Short form:</label>
    <input data-ok="they're dancing">
  </div>
</div>

<!-- 4 -->
<div class="row">
  <div class="pic">
    <img src="https://i.imgur.com/x5x4rYH.png">
  </div>
  <div class="item">
    <b>4. talk on the phone</b>
    <label>Long form:</label>
    <input data-ok="the woman is talking on the phone">
    <label>Short form:</label>
    <input data-ok="she's talking on the phone">
  </div>
</div>

<!-- 5 -->
<div class="row">
  <div class="pic">
    <img src="images/day4PC.png">
  </div>
  <div class="item">
    <b>5. jump over the fence</b>
    <label>Long form:</label>
    <input data-ok="the horse is jumping over the fence">
    <label>Short form:</label>
    <input data-ok="it's jumping over the fence">
  </div>
</div>

<!-- 6 -->
<div class="row">
  <div class="pic">
    <img src="https://i.imgur.com/EN4vK1k.png">
  </div>
  <div class="item">
    <b>6. work in the garden</b>
    <label>Long form:</label>
    <input data-ok="the men are working in the garden">
    <label>Short form:</label>
    <input data-ok="they're working in the garden">
  </div>
</div>

<button onclick="check()">✅ Check Answers</button>
<div class="result"></div>

</div>

<script>
function norm(t){
  return t.toLowerCase()
    .replace(/[.?!]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}

function check(){
  const inputs=document.querySelectorAll("input");
  let score=0;

  inputs.forEach(i=>{
    if(norm(i.value)===norm(i.dataset.ok)){
      i.className="correct";
      score++;
    }else{
      i.className="wrong";
    }
  });

  document.querySelector(".result").textContent =
    `🎯 ${score} / ${inputs.length} correct`;
}
</script>

</body>
</html>
